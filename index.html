<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de estudiantes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Encabezado de la página -->
<header><h1>Registro de estudiantes</h1><p>Los datos se guardan en este navegador (localStorage, formato JSON).</p></header>
<main>
<!-- Formulario de registro (novalidate: la validación la hace app.js con expresiones regulares). Cada campo tiene un elemento small.error para su mensaje -->
<form id="form" novalidate>
  <div class="campo"><label for="cedula">Cédula</label><input id="cedula" maxlength="10" inputmode="numeric" placeholder="0912345678"><small class="error"></small></div>
  <div class="campo"><label for="apellidos">Apellidos</label><input id="apellidos" placeholder="Pérez Mora"><small class="error"></small></div>
  <div class="campo"><label for="nombres">Nombres</label><input id="nombres" placeholder="Ana María"><small class="error"></small></div>
<!-- La dirección ocupa todo el ancho (clase ancho) -->
  <div class="campo ancho"><label for="direccion">Dirección</label><input id="direccion" placeholder="Av. Principal 123 y Calle 5"><small class="error"></small></div>
  <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" maxlength="10" inputmode="tel" placeholder="0987654321"><small class="error"></small></div>
  <div class="campo"><label for="correo">Correo electrónico</label><input id="correo" type="text" placeholder="ana@correo.com"><small class="error"></small></div>
<!-- Listas desplegables: facultad, nivel (se llena desde app.js) y paralelo -->
  <div class="campo"><label for="facultad">Facultad</label>
    <select id="facultad"><option value="">Seleccione…</option><option>Ciencias Administrativas</option><option>Ingeniería</option><option>Ciencias Médicas</option><option>Jurisprudencia</option><option>Arquitectura</option></select><small class="error"></small></div>
  <div class="campo"><label for="nivel">Nivel</label>
    <select id="nivel"><option value="">Seleccione…</option></select><small class="error"></small></div>
  <div class="campo"><label for="paralelo">Paralelo</label>
    <select id="paralelo"><option value="">Seleccione…</option><option>A</option><option>B</option><option>C</option><option>D</option></select><small class="error"></small></div>
<!-- Botones: guardar y limpiar -->
  <div class="acciones ancho"><button type="submit">Guardar estudiante</button><button type="reset" class="sec">Limpiar</button></div>
</form>
<!-- Tabla de estudiantes guardados en localStorage, con buscador -->
<section>
  <div class="barra"><h2>Estudiantes registrados (<span id="total">0</span>)</h2>
  <input id="buscar" placeholder="Buscar por cédula o apellido"></div>
  <div class="tabla-wrap"><table><thead><tr><th>Cédula</th><th>Apellidos</th><th>Nombres</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Facultad</th><th>Nivel</th><th>Par.</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
</section>
</main>
<!-- Aviso temporal de confirmación o error -->
<div id="aviso" role="status"></div>
<!-- Lógica de la aplicación -->
<script src="app.js"></script>
</body>
</html>
</html>
